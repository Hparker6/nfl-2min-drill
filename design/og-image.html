<!-- Source of public/og.png (1200 x 630). Open in Chrome at a 1200 x 630 viewport and screenshot it to re-render. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=block" rel="stylesheet">
<style>
  :root { --bg: #0a0e0c; --accent: #f5c518; --ink: #edf2ee; --ink2: #c9d3cc; --muted: #8b9b91; }
  html, body { margin: 0; width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
  body { position: relative; font-family: Barlow, sans-serif; color: var(--ink); }

  /* the field, seen from a broadcast camera high behind the offense */
  .cam { position: absolute; left: 500px; top: 0; width: 760px; height: 630px; perspective: 1000px; perspective-origin: 50% 10%; }
  .field { position: absolute; left: 50%; top: 92px; width: 600px; height: 470px; margin-left: -270px; transform: rotateX(40deg) rotateZ(-7deg); transform-origin: 50% 0%; }
  .field svg { width: 100%; height: 100%; display: block; }

  /* fade the field into the dark side so the title owns the left */
  .fade { position: absolute; inset: 0; background:
    linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(10,14,12,.86) 47%, rgba(10,14,12,.25) 62%, rgba(10,14,12,0) 74%),
    linear-gradient(0deg, rgba(10,14,12,.55) 0%, rgba(10,14,12,0) 16%), linear-gradient(180deg, rgba(10,14,12,.7) 0%, rgba(10,14,12,0) 24%),
    radial-gradient(ellipse at 80% 40%, rgba(245,197,24,.08), transparent 55%); }

  .left { position: absolute; left: 64px; top: 58px; width: 560px; }
  .mark { width: 60px; height: 60px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; }
  .kicker { margin-top: 26px; font: 700 26px 'Barlow Condensed'; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 4px 0 0; font: 800 156px/.84 'Barlow Condensed'; text-transform: uppercase; letter-spacing: -.005em; }
  h1 .y { color: var(--accent); }
  .tag { margin-top: 24px; font: 600 27px/1.3 Barlow; color: var(--ink2); max-width: 560px; }
  .tag b { color: var(--ink); }

  /* broadcast score bug */
  .bug { position: absolute; right: 64px; top: 58px; display: flex; align-items: stretch; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.55); border: 1px solid #2a3a31; }
  .bug > div { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #0c1210; }
  .bug .t { font: 700 20px 'Barlow Condensed'; letter-spacing: .08em; color: var(--muted); }
  .bug .s { font: 700 46px/1 'Barlow Condensed'; }
  .bug .you { border-top: 4px solid #0284c7; }
  .bug .them { border-top: 4px solid #b91c1c; }
  .bug .clock { background: #070b09; flex-direction: column; justify-content: center; gap: 0; padding: 8px 20px; border-inline: 1px solid #25322b; }
  .bug .clock b { font: 700 40px/1 'Barlow Condensed'; color: var(--accent); }
  .bug .clock small { font: 600 14px Barlow; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .bug .dd { background: var(--accent); color: #1b1600; font: 800 30px 'Barlow Condensed'; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="cam">
    <div class="field">
      <!-- 600 x 980 = 53.3 yards wide, about 87 yards deep: 11.25 px per yard -->
      <svg viewBox="0 370 600 470" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="stripes" width="600" height="112.5" patternUnits="userSpaceOnUse">
            <rect width="600" height="56.25" fill="#2e7849"/><rect y="56.25" width="600" height="56.25" fill="#2a6d43"/>
          </pattern>
          <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/></marker>
          <marker id="aw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
        </defs>
        <rect width="600" height="980" fill="url(#stripes)"/>
        <!-- yard lines every 5, hashes every yard -->
        <g stroke="rgba(255,255,255,.55)" stroke-width="3">
          <line x1="0" x2="600" y1="0" y2="0"/><line x1="0" x2="600" y1="56.25" y2="56.25"/><line x1="0" x2="600" y1="112.5" y2="112.5"/><line x1="0" x2="600" y1="168.75" y2="168.75"/><line x1="0" x2="600" y1="225" y2="225"/><line x1="0" x2="600" y1="281.25" y2="281.25"/><line x1="0" x2="600" y1="337.5" y2="337.5"/><line x1="0" x2="600" y1="393.75" y2="393.75"/><line x1="0" x2="600" y1="450" y2="450"/><line x1="0" x2="600" y1="506.25" y2="506.25"/><line x1="0" x2="600" y1="562.5" y2="562.5"/><line x1="0" x2="600" y1="618.75" y2="618.75"/><line x1="0" x2="600" y1="675" y2="675"/><line x1="0" x2="600" y1="731.25" y2="731.25"/><line x1="0" x2="600" y1="787.5" y2="787.5"/><line x1="0" x2="600" y1="843.75" y2="843.75"/><line x1="0" x2="600" y1="900" y2="900"/><line x1="0" x2="600" y1="956.25" y2="956.25"/>
        </g>
        <g stroke="rgba(255,255,255,.35)" stroke-width="2.5" id="hashes"></g>
        <rect x="2" y="0" width="596" height="980" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="5"/>
        <!-- yard numbers -->
        <g fill="rgba(255,255,255,.55)" font-family="Barlow Condensed" font-weight="700" font-size="56" text-anchor="middle">
          <text x="80" y="245">4 0</text><text x="520" y="245">4 0</text>
          <text x="80" y="470">3 0</text><text x="520" y="470">3 0</text>
          <text x="80" y="695">2 0</text><text x="520" y="695">2 0</text>
        </g>
        <!-- line of scrimmage and line to gain: 4th and 2 -->
        <line x1="0" x2="600" y1="720" y2="720" stroke="#5b9cff" stroke-width="7"/>
        <line x1="0" x2="600" y1="697.5" y2="697.5" stroke="#f5c518" stroke-width="7"/>

        <!-- decoy routes -->
        <g fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round" marker-end="url(#aw)">
          <path d="M540 740 V430"/>
          <path d="M370 742 L370 650 L470 610"/>
          <path d="M262 790 Q200 760 150 700"/>
        </g>
        <!-- the call: a corner route, drawn like a telestrator -->
        <path d="M60 740 V540 L170 440" fill="none" stroke="rgba(10,14,12,.6)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 740 V540 L170 440" fill="none" stroke="#f5c518" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>

        <!-- defense: diamonds -->
        <g fill="#f2f2ea" stroke="#0a0e0c" stroke-width="3">
          <rect x="200" y="672" width="26" height="26" transform="rotate(45 213 685)"/>
          <rect x="262" y="672" width="26" height="26" transform="rotate(45 275 685)"/>
          <rect x="324" y="672" width="26" height="26" transform="rotate(45 337 685)"/>
          <rect x="386" y="672" width="26" height="26" transform="rotate(45 399 685)"/>
          <rect x="230" y="600" width="26" height="26" transform="rotate(45 243 613)"/>
          <rect x="355" y="600" width="26" height="26" transform="rotate(45 368 613)"/>
          <rect x="62" y="630" width="26" height="26" transform="rotate(45 75 643)"/>
          <rect x="515" y="630" width="26" height="26" transform="rotate(45 528 643)"/>
          <rect x="170" y="470" width="26" height="26" transform="rotate(45 183 483)"/>
          <rect x="410" y="470" width="26" height="26" transform="rotate(45 423 483)"/>
        </g>
        <!-- offense: circles -->
        <g fill="#0f8bd6" stroke="#ffffff" stroke-width="4">
          <circle cx="245" cy="745" r="15"/><circle cx="275" cy="745" r="15"/><circle cx="305" cy="745" r="15"/><circle cx="335" cy="745" r="15"/><circle cx="365" cy="745" r="15"/>
          <circle cx="305" cy="800" r="15"/><circle cx="262" cy="805" r="15"/>
          <circle cx="540" cy="745" r="15"/><circle cx="398" cy="750" r="15"/>
        </g>
        <!-- the target, ringed in yellow -->
        <circle cx="60" cy="745" r="19" fill="#0f8bd6" stroke="#f5c518" stroke-width="7"/>
        <!-- the ball -->
        <ellipse cx="305" cy="722" rx="7" ry="11" fill="#8a4b24" stroke="#2a1407" stroke-width="2"/>
      </svg>
    </div>
  </div>
  <div class="fade"></div>

  <div class="left">
    <div class="mark">
      <svg width="40" height="40" viewBox="0 0 64 64"><g transform="rotate(-35 32 32)"><ellipse cx="32" cy="32" rx="21" ry="13" fill="#1b1600"/><path d="M24 32h16M27.5 28.5v7M32 28.5v7M36.5 28.5v7" stroke="#f5c518" stroke-width="2.8" stroke-linecap="round"/></g></svg>
    </div>
    <div class="kicker">Late-game play-calling</div>
    <h1>The <span class="y">4th</span><br>Call</h1>
    <p class="tag"><b>One call. Clock running.</b><br>Every call graded against every option.</p>
  </div>

  <div class="bug">
    <div class="you"><span class="t">YOU</span><span class="s">17</span></div>
    <div class="clock"><b>0:48</b><small>4th qtr</small></div>
    <div class="them"><span class="s">20</span><span class="t">THEM</span></div>
    <div class="dd">4th &amp; 2</div>
  </div>

  <script>
    // hash marks: every yard, at the sidelines and the two hash lines
    const g = document.getElementById('hashes');
    for (let y = 0; y < 980; y += 11.25) {
      if (Math.round(y / 11.25) % 5 === 0) continue;
      for (const [x, w] of [[4, 14], [258, 12], [330, 12], [582, 14]]) {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', x); l.setAttribute('x2', x + w); l.setAttribute('y1', y); l.setAttribute('y2', y);
        g.appendChild(l);
      }
    }
  </script>
</body>
</html>
